<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Song source test (Deezer)</title>
    <!-- type="module" makes the browser wait until the whole page is parsed before
         running the script (like defer), so the elements below already exist when
         it looks them up with document.getElementById. -->
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <h1>Song source test (Deezer via our server)</h1>

    <input id="query" />
    <button id="search">Search</button>

    <!-- Search results get added here as <li> items. -->
    <ul id="results"></ul>

    <!-- One shared audio player. It has no "controls" attribute, so it's invisible;
       we drive it entirely from JavaScript. -->
    <audio id="player"></audio>
  </body>
</html>
